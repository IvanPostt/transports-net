{% extends 'users/base.html' %}

<style>
    /* Общий фон страницы */
    body {
        background: radial-gradient(circle at top left, #0d0d0d, #1c1c1c);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #f5f5f5;
    }

    /* Карточка заказа */
    .card {
        background-color: rgba(30, 30, 30, 0.95);
        border-radius: 15px;
        color: #f5f5f5;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        transition: transform 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    /* Заголовок карточки */
    .card-header h3 {
        color: #1c1c1c;
        text-shadow: 1px 1px 4px #000;
    }

    /* Метки полей */
    label {
        color: #aaa;
        font-weight: 500;
    }

    /* Поля ввода */
    input.form-control {
        background-color: #222;
        color: #f5f5f5;
        border: 1px solid #555;
        border-radius: 5px;
        padding: 10px;
    }

    input.form-control:focus {
        border-color: #00d1ff;
        box-shadow: 0 0 10px #00d1ff33;
        outline: none;
        background-color: #222;
        color: #f5f5f5;
    }

    /* Стили для кнопки */
    .btn-primary {
        background: linear-gradient(90deg, #0d0d0d, #1c1c1c);
        border: none;
        color: #fff;
        font-weight: 600;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(0, 209, 255, 0.4);
    }

    .btn-primary:hover {
        background: linear-gradient(90deg, #0d0d0d, #1c1c1c);
        box-shadow: 0 6px 20px rgba(0, 209, 255, 0.6);
        transform: translateY(-2px);
    }

    /* Стили для суммы и заголовков */
    h5 {
        color: #f5f5f5;
        font-weight: 600;
    }

    /* Отступы */
    .cart-item {
        padding: 15px;
        border-radius: 8px;
        background-color: rgba(50, 50, 50, 0.6);
        margin-bottom: 15px;
        transition: background-color 0.3s;
    }

    .cart-item:hover {
        background-color: rgba(50, 50, 50, 0.8);
    }

    /* Линии разделителей */
    hr {
        border-top: 1px solid #444;
    }
</style>

{% block content %}
<main>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">

                {% if messages %}
                <div class="alert alert-success alert-dismissible fade show mt-4" role="alert">
                    {% for message in messages %}
                    {{ message }}
                    {% endfor %}
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                </div>
                {% endif %}

                <div class="card shadow-lg border-0 mt-5">
                    <div class="card-header text-center">
                        <h3 class="my-4">Оформление заказа</h3>
                    </div>
                    <div class="card-body">
                        <form method="post" action="#">
                            {% csrf_token %}
                            <div id="cart-items">
                                {% for item in product %}
                                <div class="cart-item" data-price="{{ item.price }}">
                                    <div class="form-group">
                                        <label>Товар</label>
                                        <input type="text" class="form-control" value="{{ item.name }}" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label>Количество</label>
                                        <input type="number" name="quantity_{{ item.id }}" value="{{ item.quantity }}"
                                               class="form-control quantity-input" min="1">
                                    </div>
                                    <div class="form-group">
                                        <label>Цена за единицу</label>
                                        <input type="text" class="form-control unit-price" value="{{ item.price }}"
                                               readonly>
                                    </div>
                                    <div class="form-group">
                                        <label>Сумма</label>
                                        <input type="text" class="form-control item-total"
                                               value="{{ item.quantity|floatformat:2 }}" readonly>
                                    </div>
                                    <hr>
                                </div>
                                {% endfor %}
                            </div>
                            <div class="form-group text-left mt-3">
                                <h5>Общая сумма: {{ baskets.total_sum }} руб.</h5>
                            </div>
                            <div class="form-group text-center mt-3">
                                <a href="#" class="btn btn-primary btn-block">
                                    Сформировать заказ
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>
{% endblock %}
