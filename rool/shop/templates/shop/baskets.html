{% if baskets %}
    <h5 class="mt-3 mb-3 d-flex justify-content-between align-items-center">
        Корзина <span class="badge badge-secondary">{{ baskets.total_quantity }}</span>
    </h5>
    {% for basket in baskets %}
        <div class="card mb-2">
            <div class="card-body p-2">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="font-weight-bold">{{ basket.product.name }}</span>
                    <small class="text-muted">{{ basket.sum }} руб.</small>
                </div>
                <div class="row mt-2 text-center">
                    <div class="col-4">
                        <input name="basketID" type="number" class="form-control form-control-sm"
                               value="{{ basket.quantity }}" min="0">
                    </div>
                    <div class="col-4">
                        <a href="{% url 'products:basket_remove' basket.id %}" class="text-danger small">
                            <i class="fas fa-trash"></i> Удалить
                        </a>
                    </div>
                </div>
            </div>
        </div>
    {% endfor %}
    <div class="card mt-3">
        <div class="card-footer p-2">
            <p class="float-left mb-0">Итого:</p>
            <h5 class="float-right mb-0">{{ baskets.total_sum }} руб.</h5>
        </div>
    </div>
    <a class="btn btn-dark btn-sm mt-3 float-right" href="#">
        Cформировать счет заказа
    </a>
{% else %}
    <h5 class="mt-3 mb-3 text-center">
        Ваша корзина пуста
    </h5>
{% endif %}
