{% extends 'shop/base.html' %}
{% load static %}

{% block css %}
<link href="{% static 'sh/css/profile.css' %}" rel="stylesheet">
<style>
    .profile-container {
        max-width: 800px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .profile-image {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid #ddd;
    }
    .btn-custom {
        background-color: #212529;
        color: #fff;
        transition: 0.3s;
    }
    .btn-custom:hover {
        background-color: #343a40;
    }
    .custom-file-label::after {
        content: "Выбрать";
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="profile-container">
        <h4 class="text-center mb-4">Профиль пользователя</h4>
        <div class="text-center">
            <img class="profile-image img-thumbnail"
                 src="{% if user.image %}{{ user.image.url }}{% else %}{% static 'sh/img/users/a.webp' %}{% endif %}"
                 alt="Фото профиля">
        </div>
        <form action="{% url 'users:profile' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label class="small mb-1" for="{{ form.email.id_for_label }}">Адрес электронной почты</label>
                {{ form.email }}
            </div>
            <div class="form-row">
                <div class="col-lg-6">
                    <div class="form-group">
                        <label class="small mb-1" for="{{ form.username.id_for_label }}">Имя</label>
                        {{ form.username }}
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="form-group">
                        <label class="small mb-1" for="{{ form.city.id_for_label }}">Город</label>
                        {{ form.city }}
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="small mb-1" for="{{ form.image.id_for_label }}">Фото профиля</label>
                <div class="custom-file">
                    {{ form.image }}
                    <label class="custom-file-label" for="{{ form.image.id_for_label }}">Выберите изображение</label>
                </div>
            </div>
            <button class="btn btn-custom btn-block mt-3" type="submit">Сохранить</button>
        </form>

        <!-- Подключение корзины -->
        <div class="mt-4">
            {% include 'shop/baskets.html' %}
        </div>
    </div>
</div>
{% endblock %}
