{% extends 'users/base.html' %}
{% block content %}
<main>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                {% if messages %}
                <div class="alert alert-warning alert-dismissible fade show" role="alert" style="margin-top: 50px;">
                    {% for message in messages %}
                    {{ message }}
                    {% endfor %}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                {% endif %}
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header"><h3 class="text-center font-weight-light my-4">Сброс пароля</h3></div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="form-group">
                                <label class="small mb-1" for="username">Имя пользователя</label>
                                <input class="form-control" id="username" name="username" type="text" required>
                            </div>
                            <div class="form-group">
                                <label class="small mb-1" for="new_password">Новый пароль</label>
                                <input class="form-control" id="new_password" name="new_password" type="password" required>
                            </div>
                            <div class="form-group">
                                <label class="small mb-1" for="confirm_password">Подтвердите пароль</label>
                                <input class="form-control" id="confirm_password" name="confirm_password" type="password" required>
                            </div>
                            <div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
                                <input class="btn btn-primary" type="submit" value="Сбросить пароль">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<style>
    body {
    background: linear-gradient(135deg, #1c1c1c, #494f54);
}
    .card {
    background-color: rgba(50, 50, 50, 0.8);
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    color: #fff;
}
</style>
{% endblock %}
